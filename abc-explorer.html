<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7d6">
<link rel="icon" type="image/png" href="images/aura1.jpeg">
<title>Aura Rhymes™ | ABC Explorer</title>
<style>
:root{
  --yellow:#FFD94A;
  --yellow-soft:#FFF7D6;
  --red:#F04A45;
  --red-dark:#C93632;
  --green:#52B788;
  --blue:#5AA9E6;
  --ink:#253047;
  --muted:#667085;
  --white:#fff;
  --card:#ffffff;
  --shadow:0 12px 30px rgba(37,48,71,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--yellow-soft);color:var(--ink);font-family:Arial,"Trebuchet MS",sans-serif}
button{font:inherit}
.app{width:min(100%,1100px);margin:0 auto;padding:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-weight:900;letter-spacing:.3px;font-size:clamp(18px,4vw,24px)}
.icon-btn{border:0;background:#fff;border-radius:16px;min-width:48px;min-height:48px;padding:8px 12px;box-shadow:var(--shadow);cursor:pointer}
.icon-btn:focus-visible,.answer:focus-visible,.choice:focus-visible{outline:4px solid rgba(90,169,230,.45);outline-offset:3px}
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress{display:flex;gap:5px}
.star{font-size:22px;filter:grayscale(1);opacity:.3}
.star.on{filter:none;opacity:1}
.score{font-weight:800;min-width:58px;text-align:right}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;text-align:center}
.badge{display:inline-block;background:var(--yellow);padding:7px 13px;border-radius:999px;font-weight:900;font-size:13px}
h1{margin:8px 0 4px;font-size:clamp(28px,8vw,52px);line-height:1}
.instruction{margin:0;color:var(--muted);font-size:clamp(18px,4.5vw,25px);font-weight:800}
.object-stage{min-height:210px;display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.5vw,16px);flex-wrap:wrap;padding:22px 6px}
.object{font-size:clamp(42px,10vw,78px);line-height:1;user-select:none;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:.2}to{transform:scale(1);opacity:1}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:620px;margin:0 auto}
.choice{border:0;background:#fff;border-radius:24px;min-height:86px;font-size:clamp(30px,8vw,48px);font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(37,48,71,.10);transition:transform .12s,box-shadow .12s}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(37,48,71,.10)}
.choice.correct{background:#DDF7E9}
.choice.wrong{background:#FFE1E0}
.word{font-size:clamp(22px,5vw,34px);font-weight:900;margin-top:2px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.control{border:0;border-radius:18px;min-height:48px;padding:10px 17px;font-weight:900;cursor:pointer}
.sound{background:var(--blue);color:#fff}
.restart{background:#fff;color:var(--ink)}
.feedback{min-height:48px;margin-top:12px;font-size:clamp(19px,4.5vw,25px);font-weight:900}
.feedback.good{color:#21865A}
.feedback.try{color:var(--red-dark)}
.end{display:none;padding:30px 12px 12px;text-align:center}
.end.show{display:block}
.end-emoji{font-size:64px}
.end h2{font-size:clamp(30px,8vw,48px);margin:6px 0}
.end p{font-size:20px;color:var(--muted);font-weight:700}
.play-again{border:0;background:var(--red);color:#fff;border-radius:20px;padding:14px 24px;font-weight:900;cursor:pointer;min-height:52px}
.footer{font-size:12px;text-align:center;color:#7A8190;margin:10px 0 2px}
@media (max-width:420px){
  .app{padding:8px}
  .hero{padding:14px;border-radius:22px}
  .object-stage{min-height:175px}
  .choices{gap:9px}
  .choice{min-height:76px;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="app" id="auraAbcApp">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" type="button" aria-label="Back to Aura Lab">🏠</button>
    <div class="brand">AURA RHYMES · LAB</div>
    <div class="progress-wrap" aria-label="Progress">
      <div class="progress" id="stars" aria-hidden="true"></div>
      <div class="score" id="score">0 / 5</div>
    </div>
  </div>

  <section class="hero" id="game" aria-live="polite">
    <span class="badge">🔤 ABC EXPLORER</span>
    <h1 id="letter">A</h1>
    <div class="word" id="word">Apple</div>
    <p class="instruction" id="instruction">Find the letter A</p>

    <div class="object-stage" id="objectStage" aria-label="Example object">
      <div class="object" id="objectEmoji">🍎</div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="controls">
      <button class="control sound" id="soundBtn" type="button">🔊 Hear it</button>
      <button class="control restart" id="restartBtn" type="button">🔄 Restart</button>
    </div>

    <div class="feedback" id="feedback" aria-live="assertive"></div>

    <div class="end" id="end">
      <div class="end-emoji">🎉⭐</div>
      <h2>Great Job!</h2>
      <p id="endText">You found 5 letters.</p>
      <button class="play-again" id="playAgainBtn" type="button">Play Again</button>
    </div>
  </section>

  <div class="footer">Aura ABC Explorer · Designed for preschool learning</div>
</main>

<script>
(function(){
  "use strict";

  const DATA = [
    ["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],
    ["E","Elephant","🐘"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],
    ["I","Ice cream","🍦"],["J","Juice","🧃"],["K","Kite","🪁"],["L","Lion","🦁"],
    ["M","Moon","🌙"],["N","Nest","🪺"],["O","Orange","🍊"],["P","Parrot","🦜"],
    ["Q","Queen","👑"],["R","Rabbit","🐰"],["S","Sun","☀️"],["T","Tiger","🐯"],
    ["U","Umbrella","☂️"],["V","Van","🚐"],["W","Whale","🐋"],["X","Xylophone","🎵"],
    ["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]
  ];

  const ROUND_COUNT = 5;
  const $ = id => document.getElementById(id);
  const els = {
    letter:$("letter"), word:$("word"), instruction:$("instruction"),
    objectEmoji:$("objectEmoji"), choices:$("choices"), feedback:$("feedback"),
    score:$("score"), stars:$("stars"), soundBtn:$("soundBtn"),
    restartBtn:$("restartBtn"), playAgainBtn:$("playAgainBtn"),
    end:$("end"), endText:$("endText"), homeBtn:$("homeBtn")
  };

  let round = 0, score = 0, current = null, locked = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function makeChoices(correct){
    const distractors = shuffle(DATA.filter(x => x[0] !== correct[0])).slice(0,2);
    return shuffle([correct, ...distractors]);
  }

  function updateProgress(){
    els.score.textContent = score + " / " + ROUND_COUNT;
    els.stars.innerHTML = "";
    for(let i=0;i<ROUND_COUNT;i++){
      const s=document.createElement("span");
      s.className="star"+(i<score?" on":"");
      s.textContent="⭐";
      els.stars.appendChild(s);
    }
  }

  function speak(text){
    if(!("speechSynthesis" in window)){
      els.feedback.textContent="Audio is not available in this browser.";
      els.feedback.className="feedback try";
      return;
    }
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-IN";
      u.rate=0.78;
      u.pitch=1.08;
      u.volume=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function render(){
    locked=false;
    els.feedback.textContent="";
    els.feedback.className="feedback";
    els.end.classList.remove("show");
    els.letter.textContent=current[0];
    els.word.textContent=current[1];
    els.instruction.textContent="Find the letter " + current[0];
    els.objectEmoji.textContent=current[2];
    els.choices.innerHTML="";

    makeChoices(current).forEach(item=>{
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="choice";
      btn.textContent=item[0];
      btn.setAttribute("aria-label","Letter "+item[0]);
      btn.addEventListener("click",()=>answer(item,btn));
      els.choices.appendChild(btn);
    });
    updateProgress();
  }

  function nextRound(){
    if(round >= ROUND_COUNT){
      finish();
      return;
    }
    current=DATA[Math.floor(Math.random()*DATA.length)];
    render();
  }

  function answer(item,btn){
    if(locked) return;
    if(item[0]===current[0]){
      locked=true;
      btn.classList.add("correct");
      score++;
      round++;
      updateProgress();
      els.feedback.textContent="🌟 Great job!";
      els.feedback.className="feedback good";
      speak(current[0] + ". " + current[1]);
      setTimeout(()=>{
        if(round>=ROUND_COUNT) finish();
        else nextRound();
      },900);
    }else{
      btn.classList.add("wrong");
      els.feedback.textContent="💛 Try again!";
      els.feedback.className="feedback try";
      setTimeout(()=>btn.classList.remove("wrong"),350);
      speak("Try again");
    }
  }

  function finish(){
    locked=true;
    els.choices.innerHTML="";
    els.instruction.textContent="You completed today's ABC challenge!";
    els.objectEmoji.textContent="🏆";
    els.word.textContent="Amazing!";
    els.feedback.textContent="";
    els.endText.textContent="You found " + score + " letters correctly.";
    els.end.classList.add("show");
  }

  function restart(){
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    round=0; score=0; current=null; locked=false;
    nextRound();
  }

  els.soundBtn.addEventListener("click",()=>{
    if(current) speak(current[0] + ". " + current[1]);
  });
  els.restartBtn.addEventListener("click",restart);
  els.playAgainBtn.addEventListener("click",restart);
  els.homeBtn.addEventListener("click",()=>{
    if(history.length>1) history.back();
    else window.location.href="/";
  });

  restart();
})();
</script>
</body>
</html>
